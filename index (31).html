<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(900px 500px at 50% -120px,#3a0610 0,transparent 70%),var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 70px}
.logo{font-family:Bangers,Impact,sans-serif;font-weight:900;letter-spacing:2px}
.logo b{color:var(--red);text-shadow:0 0 14px rgba(255,30,60,.7)}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 18px}
header .logo{font-size:20px;color:var(--text);text-decoration:none}
header a.key{font-size:13px;color:#fff;text-decoration:none;border:1px solid var(--red2);padding:8px 12px;border-radius:999px;background:rgba(255,30,60,.1)}
.back{color:var(--text);text-decoration:none;font-weight:600}
h1{font-family:Bangers,Impact,sans-serif;font-size:24px;margin:4px 0 6px}
h2{font-family:Bangers,Impact,sans-serif;font-size:15px;letter-spacing:1px;margin:22px 0 10px;color:var(--red)}
.sub{color:var(--mute);margin-bottom:18px;line-height:1.5}
.hero{position:relative;overflow:hidden;border:1px solid var(--red2);border-radius:22px;padding:26px 20px;background:linear-gradient(135deg,#240308,#0c0c10 60%);box-shadow:0 0 40px rgba(255,30,60,.15)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,30,60,.35),transparent 65%)}
.hero .logo{font-size:38px}.hero p{color:var(--mute);margin-top:8px;line-height:1.5;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}

.big:active,.big:hover{border-color:var(--red);box-shadow:0 0 22px rgba(255,30,60,.25)}
.big small{display:block;font-family:Poppins;font-weight:400;color:var(--mute);font-size:12px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feat .card{margin:0;font-size:14px}.feat .card b{display:block;margin:4px 0 2px}.feat .card span{color:var(--mute);font-size:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.item b{font-size:15px;line-height:1.35}.item small{color:var(--mute)}
.price{color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));padding:6px 12px;border-radius:999px;font-weight:700;white-space:nowrap}
.chip{display:inline-block;font-size:12px;border:1px solid var(--red2);color:#ffb3bd;padding:4px 10px;border-radius:999px;margin-bottom:12px}
.video{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin-bottom:14px;border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
button,.btn{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;width:100%;cursor:pointer;text-decoration:none;display:block;text-align:center;margin-top:10px;box-shadow:0 6px 20px rgba(255,30,60,.25)}
.alt{background:transparent!important;border:1px solid var(--red2)!important;box-shadow:none!important}.green{background:var(--green)!important;box-shadow:none!important}
input,select{width:100%;background:#0a0a0e;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:15px;margin:6px 0 10px;font-family:inherit}
input:focus{outline:none;border-color:var(--red)}
label{font-size:13px;color:var(--mute)}.hide{display:none}
pre{white-space:pre-wrap;font-family:inherit;line-height:1.7;color:#d8d8e0}
.err{color:#ff6b6b;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-of-type{border:0}.row span{color:var(--mute)}.row b{text-align:right;word-break:break-word}
.warn{font-size:13px;color:var(--mute);margin-top:10px;line-height:1.5}
textarea{width:100%;background:#0a0a0e;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:13px;margin-top:6px}
.iname{font-family:Rajdhani,Bangers,Impact,sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1.25}
h1.iname{font-size:27px;margin:2px 0 8px;background:linear-gradient(90deg,#fff,#ff6b80);-webkit-background-clip:text;background-clip:text;color:transparent}
.item b.iname{font-size:18px}
.steps{display:flex;align-items:center;gap:6px;margin:2px 0 18px}
.steps i{flex:1;height:4px;border-radius:9px;background:#22222c}.steps i.on{background:linear-gradient(90deg,var(--red2),var(--red));box-shadow:0 0 10px rgba(255,30,60,.6)}
.steplbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin:-12px 0 16px;letter-spacing:.5px}.steplbl b{color:var(--red)}
.amount{text-align:center;padding:22px 12px;border:1px solid var(--red2);border-radius:20px;background:radial-gradient(circle at 50% 0,#3a0610,#10070a 70%);box-shadow:0 0 40px rgba(255,30,60,.18);margin-bottom:14px}
.amount small{color:var(--mute);letter-spacing:3px;font-size:11px}
.amount .amt{font-family:Bangers,Impact,sans-serif;font-weight:900;font-size:50px;margin:6px 0;color:#fff;text-shadow:0 0 24px rgba(255,30,60,.75)}
.amount .for{font-family:Poppins,sans-serif;font-weight:600;font-size:16px;color:#ffb3bd;letter-spacing:1px;text-transform:uppercase}
.qrbox{background:#fff;border-radius:18px;padding:14px;width:230px;margin:6px auto 12px;box-shadow:0 0 0 3px var(--red2),0 0 34px rgba(255,30,60,.35)}
.qrbox svg{display:block;width:100%;height:auto}
.upiid{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0a0a0e;border:1px dashed var(--red2);border-radius:12px;padding:12px 14px;margin:10px 0}
.upiid b{font-family:Bangers,Impact,sans-serif;font-size:14px;word-break:break-all}.upiid button{width:auto;margin:0;padding:8px 14px;font-size:13px}
.apps{text-align:center;color:var(--mute);font-size:12px;margin-top:8px}
.banner{background:rgba(31,168,85,.12);border:1px solid #1fa855;border-radius:14px;padding:14px;margin-bottom:16px;line-height:1.5;font-size:14px}
.steps{display:flex;gap:6px;margin:4px 0 18px}.steps i{flex:1;text-align:center;font-style:normal;font-size:11px;color:var(--mute);padding-top:8px;border-top:3px solid #24242c}
.steps i.on{color:#fff;border-color:var(--red);text-shadow:0 0 10px rgba(255,30,60,.6)}
.title{font-family:Bangers,Impact,sans-serif;font-weight:800;line-height:1.4;letter-spacing:.5px}
.pay{text-align:center;border:1px solid var(--red2);background:linear-gradient(160deg,#240308,var(--card));box-shadow:0 0 30px rgba(255,30,60,.12)}
.amt{font-family:Bangers,Impact,sans-serif;font-weight:900;font-size:40px;color:#fff;text-shadow:0 0 18px rgba(255,30,60,.6)}
.qr{width:210px;height:210px;margin:14px auto;background:#fff;border-radius:16px;padding:8px;box-shadow:0 0 28px rgba(255,30,60,.3)}.qr svg{width:100%;height:100%;display:block}
.upi{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0a0a0e;border:1px dashed var(--red2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;text-align:left}

.ok{color:#4ade80;font-weight:700}
/* loader */
#loader{position:fixed;inset:0;z-index:99;background:radial-gradient(600px 400px at 50% 40%,#3a0610,#050507 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#loader .logo{font-size:52px;animation:pulse 1.4s infinite}

.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red2),var(--red));box-shadow:0 0 12px var(--red);animation:load 1.9s ease-out forwards}
@keyframes load{to{width:100%}}@keyframes pulse{50%{text-shadow:0 0 30px rgba(255,30,60,.9)}}

const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const devName = d => d==='ios'?'iOS':d==='both'?'Android & iOS':'Android';

async function deriveKey(key, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(key), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function seal(key, obj){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await deriveKey(key, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, enc.encode(JSON.stringify(obj)));
  return {s:b64(salt), i:b64(iv), c:b64(ct)};
}
async function unseal(key, v){
  try{
    const k = await deriveKey(key, unb64(v.s));
    return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(v.i)}, k, unb64(v.c))));
  }catch(e){ return null; }
}

}
/* Minimal QR encoder (byte mode, ECC level M, versions 1-10) -> SVG string */
function makeQR(text){
  const data=Array.from(new TextEncoder().encode(text));
  const ECC=[10,16,26,18,24,16,18,22,22,26], BLK=[1,1,1,2,2,4,4,4,5,5];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  let ver=0,cap=0;
  for(let v=1;v<=10;v++){cap=Math.floor(raw(v)/8)-ECC[v-1]*BLK[v-1];if(4+(v<10?8:16)+8*data.length<=cap*8){ver=v;break}}
  if(!ver)throw new Error('QR text too long');
  const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
  put(4,4);put(data.length,ver<10?8:16);data.forEach(b=>put(b,8));
  put(0,Math.min(4,cap*8-bits.length));while(bits.length%8)bits.push(0);
  for(let p=0xEC;bits.length<cap*8;p^=0xEC^0x11)put(p,8);
  const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(parseInt(bits.slice(i,i+8).join(''),2));
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  const eccLen=ECC[ver-1],nb=BLK[ver-1];
  const div=Array(eccLen).fill(0);div[eccLen-1]=1;let root=1;
  for(let i=0;i<eccLen;i++){for(let j=0;j<eccLen;j++){div[j]=mul(div[j],root);if(j+1<eccLen)div[j]^=div[j+1]}root=mul(root,2)}
  const rem=d=>{const r=Array(eccLen).fill(0);for(const b of d){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r};
  const rawCw=Math.floor(raw(ver)/8),nShort=nb-rawCw%nb,shortLen=Math.floor(rawCw/nb);
  const blocks=[];for(let i=0,k=0;i<nb;i++){const d=cw.slice(k,k+shortLen-eccLen+(i<nShort?0:1));k+=d.length;const e=rem(d);if(i<nShort)d.push(0);blocks.push(d.concat(e))}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-eccLen||j>=nShort)all.push(b[i])});
  const size=ver*4+17;let M=[];const F=[];for(let i=0;i<size;i++){M.push(Array(size).fill(false));F.push(Array(size).fill(false))}
  const set=(x,y,d)=>{if(x>=0&&x<size&&y>=0&&y<size){M[y][x]=d;F[y][x]=true}};
  for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,d!==2&&d!==4)}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  if(ver>1){const n=Math.floor(ver/7)+2,step=Math.floor((ver*8+n*3+5)/(n*4-4))*2,pos=[6];for(let p=size-7;pos.length<n;p-=step)pos.splice(1,0,p);
    for(let a=0;a<n;a++)for(let b=0;b<n;b++){if((a===0&&b===0)||(a===0&&b===n-1)||(a===n-1&&b===0))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(pos[a]+dx,pos[b]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}}
  const fmt=(mask)=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};
  fmt(0);
  if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;for(let i=0;i<18;i++){const c=((b>>>i)&1)!==0,a=size-11+i%3,d=Math.floor(i/3);set(a,d,c);set(d,a,c)}}
  let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,y=((right+1)&2)===0?size-1-v:v;
    if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!==0;i++}}}
  const M0=M.map(r=>r.slice());
  const MF=[x=>0,(x,y)=>(x+y)%2,(x,y)=>y%2,(x,y)=>x%3,(x,y)=>(x+y)%3,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2,(x,y)=>x*y%2+x*y%3,(x,y)=>(x*y%2+x*y%3)%2,(x,y)=>((x+y)%2+x*y%3)%2];
  const maskOk=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const pen=()=>{let p=0,dark=0;const A=[1,0,1,1,1,0,1,0,0,0,0],B=A.slice().reverse();
    for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(M[y][x])dark++;
    for(let t=0;t<2;t++)for(let a=0;a<size;a++){const line=[];for(let b=0;b<size;b++)line.push(t?M[b][a]:M[a][b]?1:0);const L=line.map(Number);
      let run=1;for(let b=1;b<size;b++){if(L[b]===L[b-1]){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}
      for(let b=0;b+11<=size;b++){const w=L.slice(b,b+11);if(w.every((v,k)=>v===A[k])||w.every((v,k)=>v===B[k]))p+=40}}
    for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
    const tot=size*size;p+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;return p};
  let best=0,bestP=Infinity,bestM=null;
  for(let m=0;m<8;m++){M=M0.map(r=>r.slice());for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&maskOk[m](x,y))M[y][x]=!M[y][x];

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
}

function list(type){
  const items = ITEMS.filter(i => i.type === type);
  $app.innerHTML = `<header><a class="back" href="#/">← Back</a>${`<a class="key" href="#/unlock">🗝️ Unlock key</a>`}</header>
  <h1>${type==='sensi'?'SENSI':'PANEL'}</h1><p class="sub">Tap one to see details</p>` +
  (items.length ? items.map(i => `<a class="card item" href="#/item/${i.id}"><div><b class="iname">${esc(i.name)}</b><br><small>${devName(i.device)}</small></div><span class="price">₹${i.price}</span></a>`).join('')
                : '<div class="card"><p class="sub" style="margin:0">Coming soon.</p></div>');
}
const STEPNAMES=['Details','Payment','Order','Key'];
const stepBar=n=>`<div class="steps">${STEPNAMES.map((s,i)=>`<i class="${i<n?'on':''}">${i+1}. ${s}</i>`).join('')}</div>`;
let FLOW={id:null,step:1,name:''};
const upiLink=it=>`upi://pay?pa=${CONFIG.upiId}&pn=${encodeURIComponent(CONFIG.upiName)}&am=${it.price}.00&cu=INR&tn=${encodeURIComponent('DMX FF')}`;

function item(id,reset){
  const it = ITEMS.find(i => i.id === id);
  if(!it) return home();
  if(reset||FLOW.id!==id) FLOW={id,step:1,name:''};
  const st=FLOW.step, $=x=>document.getElementById(x);
  const back = st===1 ? `<a class="back" href="#/list/${it.type}">← Back</a>` : `<a class="back" href="javascript:void(0)" id="prev">← Back</a>`;
  let body='';
  const head=`<h1 class="iname">${esc(it.name)}</h1><span class="chip">${it.type==='sensi'?'Sensi':'Panel'} · ${devName(it.device)}</span>`;
  if(st===1){
    body=`${head}
    ${it.video?`<div class="video"><iframe src="${esc(preview(it.video))}" allow="autoplay" allowfullscreen></iframe></div>`:''}
    <div class="card"><div class="row"><span>Rate</span><span class="price">₹${it.price}</span></div><pre style="margin-top:10px">${esc(it.details)}</pre></div>
    <button id="next">Next → Go to payment</button>`;
  }else if(st===2){
    body=`${head}
    <div class="card pay"><div class="warn" style="margin:0">Amount to pay</div><div class="amt">₹${it.price}</div>
      <div class="qr" id="qr"></div><div class="warn" style="margin-top:0">Scan with any UPI app (GPay, PhonePe, Paytm...)</div>
      <a class="btn" href="${esc(upiLink(it))}">Pay ₹${it.price} with any UPI app</a>
      <div class="upi"><span>UPI ID: <b>${esc(CONFIG.upiId)}</b></span><button id="copy" class="alt">Copy</button></div></div>
    <button class="green" id="next">I have paid → Next</button>`;
  }else if(st===3){
    body=`${head}
    <div class="card"><label>Your name</label><input id="cname" placeholder="Enter your name" value="${esc(FLOW.name)}">
      <div class="row"><span>Item</span><b>${esc(it.name)}</b></div>
      <div class="row"><span>Device</span><b>${devName(it.device)}</b></div>
      <div class="row"><span>Paid</span><b>₹${it.price}</b></div></div>
    <a class="btn green" id="wa" target="_blank" rel="noopener">✅ Place order on WhatsApp</a>
    <p class="warn">Send the payment screenshot in the WhatsApp chat. We will reply with your key.</p>`;
  }else{
    body=`<div class="card pay"><div class="ok" style="font-size:18px">✅ Order placed</div>
      <p class="warn">Waiting for your key on WhatsApp. Enter it below to unlock your download.</p></div><div id="keybox"></div>`;
  }
  $app.innerHTML=`<header>${back}<a class="key" href="#/unlock">🗝️ Unlock key</a></header>${stepBar(st)}${body}`;
  if($('prev')) $('prev').onclick=()=>{FLOW.step--;item(id)};
  if($('next')) $('next').onclick=()=>{FLOW.step++;item(id);window.scrollTo(0,0)};
  if(st===2){
    try{$('qr').innerHTML=makeQR(upiLink(it))}catch(e){$('qr').innerHTML=''}
    $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(CONFIG.upiId);$('copy').textContent='Copied'}catch(e){$('copy').textContent=CONFIG.upiId}};
  }
  if(st===3){
    const upd=()=>{FLOW.name=$('cname').value;$('wa').href=supportLink(`New Order - DMX FF\nType: ${it.type==='sensi'?'Sensi':'Panel'}\nItem: ${it.name}\nDevice: ${devName(it.device)}\nRate: ₹${it.price}\nPayment: Done (UPI)\nName: ${FLOW.name||'-'}`)};
    $('cname').oninput=upd;upd();
    $('wa').onclick=()=>{setTimeout(()=>{FLOW.step=4;item(id);window.scrollTo(0,0)},700)};
  }
  if(st===4) keyBox($('keybox'));
}
function keyBox(el){
  el.innerHTML=`<div class="card" id="form"><label>Enter your key</label><input id="key" placeholder="Enter key" autocomplete="off" inputmode="numeric" style="letter-spacing:3px;font-size:18px">
    <button id="go">Unlock</button><p class="err" id="err"></p></div><div id="result"></div>`;
  const $=x=>el.querySelector('#'+x);
  const run=async()=>{
    $('err').textContent='';const key=$('key').value.trim();if(!key)return;
    $('go').textContent='Checking...';const hits=[];
    for(const it of ITEMS)for(const v of(it.vault||[])){const d=await unseal(key,v);if(d)hits.push({it,d})}
    $('go').textContent='Unlock';
    if(!hits.length){$('err').textContent='Invalid key. Message our support team if you need help.';return}
    $('form').classList.add('hide');
    $('result').innerHTML=hits.map(({it,d})=>`<div class="card">
      <div class="row"><span>Name</span><b class="iname" style="font-size:15px">${esc(it.name)}</b></div>
      <div class="row"><span>Device</span><b>${devName(d.device)}</b></div>
      <div class="row"><span>Password for extract zip</span><b>${d.password?esc(d.password):'No password'}</b></div>
      ${d.url?`<a class="btn green" href="${esc(d.url)}" target="_blank" rel="noopener">⬇ Download</a>`:`<p class="warn">File is not added yet. Please message our support team.</p>`}
      <p class="warn">If the password is wrong, message our support team.</p>
      <a class="btn alt" target="_blank" href="${supportLink('Hi DMX FF, I need support with: '+it.name)}">💬 Message support</a></div>`).join('');
  };
  $('go').onclick=run;$('key').onkeydown=e=>{if(e.key==='Enter')run()};
}
function unlock(){
  $app.innerHTML=`<header><a class="back" href="#/">← Home</a></header><h1>UNLOCK KEY 🗝️</h1><p class="sub">Enter the key you got on WhatsApp after payment</p><div id="keybox"></div>`;
  keyBox(document.getElementById('keybox'));
}
function tools(){
  $app.innerHTML = `<header><a class="back" href="#/">Owner tools</a></header>
  <h1>GENERATE KEY</h1><p class="sub">Encrypts a download link with a key. Paste the output into that item's <b>vault</b> list.</p>
  <div class="card">
    <label>Device</label><select id="t_dev"><option value="android">Android</option><option value="ios">iOS</option><option value="both">Both</option></select>
    <label>Download link</label><input id="t_url" placeholder="https://...">
    <label>Extract password (optional)</label><input id="t_pw">
    <label>Secure key</label><input id="t_key" placeholder="e.g. 1234 (blank = auto)">
    <button id="t_go">Generate</button>
    <div class="hide" id="t_out"><p class="warn">Key for customer:</p><div class="row"><b id="t_k"></b></div>
      <p class="warn">Paste inside vault:[ ] of the item (comma between if more):</p><textarea id="t_v" rows="4" readonly></textarea></div>
  </div>`;
  const $ = x => document.getElementById(x);
  $('t_go').onclick = async () => {
    const url = $('t_url').value.trim(); if(!url) return;
    const key = $('t_key').value.trim() || Array.from(crypto.getRandomValues(new Uint8Array(4))).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
    const v = await seal(key, {device:$('t_dev').value, url, password:$('t_pw').value});
    $('t_out').classList.remove('hide'); $('t_k').textContent = key; $('t_v').value = JSON.stringify(v);
  };
}
function route(){
  const [, a, b0] = location.hash.split('/'); const b = decodeURIComponent(b0||'');
  if(a==='list') list(b); else if(a==='item') item(b,true); else if(a==='pay') pay(b); else if(a==='unlock') unlock(b==='done'); else if(a==='tools') tools(); else home();
  window.scrollTo(0,0);
}
addEventListener('hashchange', route); route();
setTimeout(()=>{const l=document.getElementById('loader');l.style.opacity=0;setTimeout(()=>l.remove(),500)}, 2000);
</script></body></html>
